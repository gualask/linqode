name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      # Every target the release builds, so a platform-specific call is
      # caught on the push that adds it rather than on the tag.
      - run: |
          for target in darwin/amd64 darwin/arm64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
          done
      - run: go vet ./...
      # The e2e package is behind a build tag, so nothing above compiles it.
      # Vetting it keeps the fixture code from rotting; running it needs a
      # Docker engine and stays a local step.
      - run: go vet -tags e2e ./tests/e2e/
      - uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
      - run: go test ./...
