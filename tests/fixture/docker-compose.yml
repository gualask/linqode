# Brings up the fixture server. Driven by the e2e test's TestMain, not meant
# to be long-lived: `docker compose down -v` leaves nothing behind.
#
#   docker compose up -d --build
#   ssh -p 2222 -i .keys/id_ed25519 linqode@127.0.0.1
#
# The authorized key is generated by the test into ./.keys (gitignored).

name: linqode-fixture

services:
  server:
    build: .
    # docker-in-docker needs it; the daemon inside manages real containers.
    privileged: true
    # Passed through to dockerd: makes the socket group-owned by `docker`, so
    # the unprivileged `linqode` account can reach it.
    command: ["--group", "docker"]
    environment:
      # No TLS: the daemon is only ever reached over the local unix socket,
      # from inside this container.
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ./.keys:/fixture:ro
      # The inner daemon needs a real volume for its storage: overlayfs on
      # top of the outer overlayfs is not supported. Teardown is `down -v`,
      # so every run starts from a clean daemon.
      - fixture-docker:/var/lib/docker

volumes:
  fixture-docker:
